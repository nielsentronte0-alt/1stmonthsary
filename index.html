<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3E9D2">
<title>Happy 1st Monthsary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Karla:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="cover" class="screen">
  <div class="corner corner-for">FOR: <span id="forName">—</span></div>
  <div class="corner corner-stamp">
    <div class="postmark"><span id="postmarkDate">—</span></div>
  </div>
  <div class="cover-main">
    <p class="eyebrow"><span id="eyebrowCount">—</span></p>
    <h1 class="cover-title">Happy Monthsary</h1>
    <p class="cover-sub">for the girl who makes every month feel like the best one yet</p>
    <button type="button" class="seal" id="sealBtn" aria-label="Break the seal to open your surprise">
      <svg viewBox="0 0 24 24" xmlns="A Piece Of You  Nathaniel Constantin (Lyrics).mp3"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
    <p class="seal-hint">press to break the seal</p>
  </div>
</div>

<div id="celebration" class="screen">
  <div id="bloom-container"></div>
  <div id="message-card">
    <button type="button" class="mc-close" id="mcClose">&times;</button>
    <h2 id="message-heading">—</h2>
    <p id="message-sub">—</p>
    <button type="button" class="replay-btn" id="replayBtn">&#8634; open it again</button>
  </div>
</div>

<style id="spiral-styles"></style>

<div id="lightbox">
  <button type="button" class="lb-close" id="lbClose">&times;</button>
  <img id="lbImg" src="" alt="">
  <div id="lbText"></div>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<audio id="bgm" preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
